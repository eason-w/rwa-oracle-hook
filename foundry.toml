[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "forge-std/=lib/v4-core/lib/forge-std/src/",
  "permit2/=lib/v4-periphery/lib/permit2/",
  "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=lib/v4-core/lib/openzeppelin-contracts/",
  "solmate/=lib/v4-core/lib/solmate/"
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = true

[fmt]
line_length = 110
bracket_spacing = true

[lint]
# Public immutable getters use the same lowerCamelCase API as v4's poolManager getter.
exclude_lints = ["screaming-snake-case-immutable"]
